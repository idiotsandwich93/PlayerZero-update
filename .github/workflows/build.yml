name: Build PlayerZero++ ASI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Release x64
      working-directory: PlayerZero_Asi
      run: |
        msbuild "PlayerZero++.sln" /p:Configuration=Release /p:Platform=x64 /m

    - name: Upload ASI artifact
      uses: actions/upload-artifact@v4
      with:
        name: PlayerZero++
        path: PlayerZero_Asi/PlayerZero++/bin/Release/PlayerZero++.asi
        if-no-files-found: error
